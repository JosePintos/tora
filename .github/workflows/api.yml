name: API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

# Third-party actions are pinned to a full commit SHA (the tag is in the comment).
# Tags can be moved to point at different code; a SHA cannot. To update, look up
# the new tag's SHA, or let Dependabot do it.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Runs the linters in apps/api/.golangci.yml, including govet (go vet).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same database as the postgres-test service in docker-compose.yml, so the
    # committed apps/api/.env.test works unchanged.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tora_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -count=1 $(go list ./... | grep -v /persistence/postgres)

      # -p 1 runs one package at a time. The repository test packages share one
      # database and TRUNCATE it on cleanup, so running them in parallel would
      # let one package delete rows another is still using.
      - name: Integration tests
        run: go test -race -count=1 -p 1 $(go list ./... | grep /persistence/postgres)

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Reports known vulnerabilities only in code paths the API actually calls.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
