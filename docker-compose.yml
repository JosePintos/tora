services:
  postgres:
    image: postgres:17
    container_name: tora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  migrate:
    image: migrate/migrate
    profiles:
      - tools
    volumes:
      - ./apps/api/migrations:/migrations  
  
  postgres-test:
    image: postgres:17
    container_name: tora-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tora_test
    ports:
      - "5433:5432"

volumes:
  postgres_data: